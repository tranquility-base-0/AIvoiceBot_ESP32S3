; PlatformIO Project Configuration File — Track B (Local LAN WebSocket Audio Terminal)
; Board: Seeed Studio XIAO ESP32-S3 (8 MB Quad SPI Flash, 8 MB Octal PSRAM)
; Zero-TLS, zero-JSON, zero-WAV-header thin PCM transceiver

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    links2004/WebSockets @ ^2.4.1
